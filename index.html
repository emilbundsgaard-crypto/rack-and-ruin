<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ClouterX — a datacentre simulator</title>
<meta name="description" content="ClouterX — an incremental datacentre simulator in the browser. Build from a broom cupboard to a continental site: power, water, heat, deals — and the town next door, paying for all of it.">
<meta name="theme-color" content="#0e0c0a">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="ClouterX">
<meta property="og:description" content="ClouterX — an incremental datacentre simulator. It starts in a broom cupboard. Ashbrook does not survive it.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="styles/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230e0c0a'/><rect x='6' y='5' width='20' height='6' rx='1' fill='%23f2a83c'/><rect x='6' y='13' width='20' height='6' rx='1' fill='%23f2a83c' opacity='.62'/><rect x='6' y='21' width='20' height='6' rx='1' fill='%23f2a83c' opacity='.3'/></svg>">
</head>
<body>

<div id="app" hidden>
  <header id="topbar"></header>

  <main id="main">
    <section id="floor">
      <div id="floorhead">
        <div id="facilityname"></div>
        <div id="events"></div>
        <div id="floortools"></div>
      </div>
      <div id="canvaswrap">
        <canvas id="view"></canvas>
        <div id="tutorial" hidden></div>
        <div id="ghost"></div>
        <div id="paused" hidden><span>Paused</span></div>
        <div id="banner" hidden aria-live="polite"></div>
        <div id="toasts"></div>
      </div>
      <div id="inspector"></div>
    </section>

    <aside id="panel">
      <nav id="tabs"></nav>
      <div id="tabbody"></div>
    </aside>
  </main>

  <footer id="logbar">
    <div id="objective"></div>
    <div id="logfeed"></div>
  </footer>
</div>

<div id="boot">
  <canvas id="bootsky" aria-hidden="true"></canvas>
  <div class="bootcard">
    <h1>Clouter<span>X</span></h1>
    <p class="sub">Rack &amp; Ruin</p>
    <p class="tag">A datacentre simulator. It starts in a broom cupboard.</p>
    <div id="bootbody">Loading…</div>
  </div>
</div>

<div id="tip" hidden></div>
<div id="modal" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
